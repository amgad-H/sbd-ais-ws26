definitions:
  Drink:
    properties:
      description:
        description: Description is a short text shown next to the drink on the menu.
        type: string
      id:
        description: ID uniquely identifies the drink and is referenced by Order.DrinkID.
        type: integer
      name:
        description: Name is the display name shown on the menu.
        type: string
      price:
        description: Price is the price per unit. A float is used since prices have
          decimals.
        type: number
    type: object
  Order:
    properties:
      amount:
        description: |-
          Amount is the number of units ordered. It is unsigned because
          a negative amount would not make sense.
        type: integer
      created_at:
        description: |-
          CreatedAt is the time the order was placed. In JSON it is encoded
          as an RFC 3339 timestamp, e.g. "2026-10-20T10:30:00+02:00".
        type: string
      drink_id:
        description: DrinkID is a foreign key that references Drink.ID.
        type: integer
    type: object
info:
  contact:
    name: Your Name
  description: This system enables drink orders and should not be used for the forbidden
    Hungover Games.
  title: Order System
paths:
  /api/menu:
    get:
      description: Returns the menu of all drinks
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Drink'
            type: array
      tags:
      - Menu
  /api/order:
    post:
      consumes:
      - application/json
      description: Adds an order to the db
      parameters:
      - description: Order
        in: body
        name: b
        required: true
        schema:
          $ref: '#/definitions/Order'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      tags:
      - Order
  /api/order/all:
    get:
      description: Returns all orders
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Order'
            type: array
      tags:
      - Order
  /api/order/totalled:
    get:
      description: Returns how many of each drink have been ordered (drink id -> amount)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
      tags:
      - Order
swagger: "2.0"
